name: Update market dashboard

on:
  schedule:
    # 09:00 UTC = 18:00 JST, after the Tokyo market close.
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh README and workbook
        run: python -m src.main
      - name: Commit dashboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update market dashboard"
            git push
          fi